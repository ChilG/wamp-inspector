<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WAMP Mock Router</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/demo.css" />
    <script type="module" src="/demo.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>WAMP Mock Router</h1>
        <p role="status" aria-label="Connection status" id="connection-status">
          Connecting…
        </p>
      </header>
      <form>
        <label for="scenario">Scenario</label>
        <div class="controls">
          <select id="scenario">
            <option value="demo.success">Success</option>
            <option value="demo.error">Error</option>
            <option value="demo.no_response">No response</option>
          </select>
          <button type="submit" disabled>Send CALL</button>
        </div>
      </form>
      <p role="status" aria-label="Call result" id="call-result"></p>
    </main>
  </body>
</html>
