name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: npm ci --ignore-scripts

      - name: Bump extension version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: node scripts/bump-version.mjs "$BUMP_TYPE"

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Open version pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/open-version-pr.sh
